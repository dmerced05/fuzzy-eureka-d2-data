name: Update sheet data

on:
  schedule:
    - cron: "17 9 * * 3"   # Wednesdays, after the weekly reset
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch sheets
        run: python tools/fetch_sheets.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch Bungie weapon data
        run: node tools/bungie-weapons.mjs && node tools/bungie-icons.mjs
      - name: Build site data
        run: python tools/build_data.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes in the source sheets."
          else
            git commit -m "Update data from source sheets"
            git push
          fi
